<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <div class="Main_container">  
    <div class="container">
      <div class="result_container">
        <div class="result_container_head grey">
          Your Result
        </div>
        <div class="result_container_result">
          <p class="result">76</p>
          <p class="grey">of 100</p>
        </div>
        <div class="result_container_great">
          Great
        </div>
        <div class="result_container_text grey">
          You scored higher than 65% of the people who have taken these tests.
        </div>
      </div>
      <div class="summary_container">
        <div class="summary_container_head">
          Summary
        </div>
        <div class="summary_container_reaction summary summary_1">
          <p>Reaction</p>
          <p>80 <span class="grey">/ 100</span></p>
        </div>
        <div class="summary_container_memory summary summary_2">
          <p>Memory</p>
          <p>92 <span class="grey">/ 100</span></p>
        </div>
        <div class="summary_container_verbal summary summary_3">
          <p>Verbal</p>
          <p>61 <span class="grey">/ 100</span></p>
        </div>
        <div class="summary_container_visual summary summary_4">
          <p>Visual</p>
          <p>72 <span class="grey">/ 100</span></p>
        </div>
        <div class="summary_container_button">
          Continue
        </div>
      </div>
    </div>  
  </div>
</body>
</html>
